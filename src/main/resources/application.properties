spring.application.name=pii-protector

# PostgreSQL is the default. Override these properties to select another supported JDBC database.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pii_protector}
spring.datasource.username=${DB_USERNAME:pii}
spring.datasource.password=${DB_PASSWORD:pii_dev_only}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Provide a Base64-encoded 256-bit key; do not commit a production key.
pii.encryption.key=${PII_ENCRYPTION_KEY:}

# Keycloak realm issuer; override when Keycloak is not exposed on the local Compose port.
pii.security.oauth2.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:8181/realms/pii-protector}
pii.security.oauth2.required-scope=${OAUTH2_REQUIRED_SCOPE:pii.jobs}
